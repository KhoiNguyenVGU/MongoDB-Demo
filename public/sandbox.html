<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sandbox · MFlix MongoDB Demo</title>
  <script>try{var t=localStorage.getItem('theme');if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark')}catch(e){}</script>
  <script>document.documentElement.dataset.role=(document.cookie.match(/(?:^|; )role=(admin|user)/)||[])[1]||''</script>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="min-h-screen">
  <div id="nav"></div>
  <main class="max-w-7xl mx-auto px-4 py-6 space-y-5">
    <div class="flex flex-wrap items-end justify-between gap-3">
      <div>
        <h1 class="page-title">Sandbox</h1>
        <p class="muted text-sm mt-1">Các database bạn tự tạo trên cluster. Ẩn database hệ thống và dữ liệu mẫu <code>sample_*</code>.</p>
      </div>
      <button class="btn btn-primary admin-only" id="newDbBtn">+ Database mới</button>
    </div>

    <div class="grid lg:grid-cols-[280px_minmax(0,1fr)] gap-5 items-start">
      <aside class="card p-3 lg:sticky lg:top-20" aria-label="Databases">
        <div class="flex items-center justify-between px-2 pb-2">
          <span class="label" style="margin:0">Databases</span>
          <button class="btn btn-sm btn-ghost" id="refreshBtn" title="Tải lại danh sách" aria-label="Tải lại danh sách">↻</button>
        </div>
        <div id="dbList"></div>
        <p id="hiddenDbs" class="text-xs muted px-2 pt-3"></p>
      </aside>

      <section id="main" class="space-y-4 min-w-0" aria-live="polite"></section>
    </div>
  </main>
  <script src="/js/common.js"></script>
  <script src="/js/sandbox.js"></script>
</body>
</html>
