<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Watchlist · MFlix MongoDB Demo</title>
  <script>try{var t=localStorage.getItem('theme');if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark')}catch(e){}</script>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="min-h-screen">
  <div id="nav"></div>
  <main class="max-w-4xl mx-auto px-4 py-6 space-y-5">
    <div class="flex flex-wrap items-end justify-between gap-3">
      <div>
        <h1 class="page-title">Watchlist</h1>
        <p class="muted text-sm mt-1">Database thứ hai <code>movie_demo.watchlist</code> trong cùng cluster Atlas</p>
      </div>
      <div class="flex gap-2">
        <button class="btn btn-sm btn-query" data-query="list">{ }</button>
        <button class="btn btn-primary" id="addBtn">+ Thêm phim</button>
      </div>
    </div>
    <section id="summary" class="grid grid-cols-2 sm:grid-cols-4 gap-3" aria-label="Tổng quan"></section>
    <div class="flex gap-1" role="tablist" aria-label="Lọc">
      <button class="chip on" data-tab="all" role="tab" aria-selected="true">Tất cả</button>
      <button class="chip" data-tab="todo" role="tab" aria-selected="false">Chưa xem</button>
      <button class="chip" data-tab="done" role="tab" aria-selected="false">Đã xem</button>
    </div>
    <div id="list" class="space-y-2"></div>
  </main>
  <script src="/js/common.js"></script>
  <script src="/js/watchlist.js"></script>
</body>
</html>
